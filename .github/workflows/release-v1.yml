name: One-time v1.0.0 Release

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/release-v1.yml' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: gradle build --stacktrace
      - name: Publish v1.0.0 once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "$(gh release view v1.0.0 --json tagName --jq .tagName 2>/dev/null)"
          asset="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$asset"
          gh release create v1.0.0 "$asset" --target "${GITHUB_SHA}" --title "Donut AC Test Client v1.0.0" --notes "Fabric 1.21.11 authorized anti-cheat diagnostics build. Install the same JAR on the Fabric server and authorized test client."
